<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="Google Sans, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17161c"/>
      <stop offset="100%" stop-color="#0f0e12"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C6F24A"/>
      <stop offset="100%" stop-color="#EAF88E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="260" rx="24" fill="url(#bg)"/>

  <!-- Card: SD / OTG -->
  <g transform="translate(40,70)">
    <rect width="190" height="120" rx="22" fill="#1c1b21"/>
    <g transform="translate(65,24)">
      <rect x="0" y="8" width="60" height="72" rx="8" fill="#26252c"/>
      <path d="M8 8 L8 -6 L42 -6 L52 8 Z" fill="#26252c"/>
      <rect x="14" y="0" width="8" height="18" fill="#C6F24A"/>
      <rect x="26" y="0" width="8" height="18" fill="#C6F24A"/>
      <rect x="38" y="0" width="8" height="18" fill="#C6F24A"/>
    </g>
    <text x="95" y="112" fill="#e4e1e6" font-size="15" font-weight="700" text-anchor="middle">SD / OTG</text>
  </g>

  <!-- Arrow with lock (root) -->
  <g transform="translate(255,0)">
    <path d="M0 130 H235" stroke="url(#lime)" stroke-width="4" fill="none"/>
    <path d="M225 118 L245 130 L225 142" stroke="url(#lime)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(90,84)">
      <rect width="60" height="46" rx="14" fill="#131318" stroke="#C6F24A" stroke-width="2"/>
      <path d="M18 20 v-6 a12 12 0 0 1 24 0 v6" fill="none" stroke="#C6F24A" stroke-width="3"/>
      <rect x="14" y="20" width="32" height="20" rx="5" fill="#C6F24A"/>
    </g>
    <text x="120" y="160" fill="#8b8790" font-size="12" text-anchor="middle">bind mount (root)</text>
  </g>

  <!-- Card: Internal storage -->
  <g transform="translate(530,70)">
    <rect width="190" height="120" rx="22" fill="#1c1b21"/>
    <g transform="translate(55,26)">
      <path d="M0 12 h30 l10 14 h50 a6 6 0 0 1 6 6 v40 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 Z" fill="#C6F24A"/>
    </g>
    <text x="95" y="112" fill="#e4e1e6" font-size="15" font-weight="700" text-anchor="middle">Almacenamiento interno</text>
  </g>

  <text x="380" y="230" fill="#5b5860" font-size="12" text-anchor="middle">La carpeta elegida aparece dentro del almacenamiento interno, sin copiar archivos</text>
</svg>
