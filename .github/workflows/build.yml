name: Build APK + módulo KSU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes del SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK (debug, instalable)
        run: gradle :app:assembleDebug --stacktrace -Pandroid.injected.testOnly=false

      - name: Copiar APK dentro del módulo
        run: |
          mkdir -p module/app
          cp app/build/outputs/apk/debug/app-debug.apk module/app/sdcard-bind-manager.apk

      - name: Empaquetar módulo final (zip listo para instalar)
        run: |
          cd module
          zip -r -X ../sdcard_bind_ui_con_app.zip . -x ".*"

      - name: Subir zip como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: sdcard_bind_ui_con_app
          path: sdcard_bind_ui_con_app.zip

      - name: Versión y update.json
        id: ver
        run: |
          VER=$(grep '^version=' module/module.prop | cut -d= -f2 | tr -d '\r')
          CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2 | tr -d '\r')
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          cat > update.json << EOF
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "https://github.com/jpmorales9038-ai/sdbind_project/releases/download/${VER}/sdcard_bind_ui_con_app.zip",
            "changelog": "https://github.com/jpmorales9038-ai/sdbind_project/releases/tag/${VER}"
          }
          EOF

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: SD Bind ${{ steps.ver.outputs.tag }}
          files: |
            sdcard_bind_ui_con_app.zip
            update.json
          generate_release_notes: true
          make_latest: true
