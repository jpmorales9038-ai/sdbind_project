name: Build APK + módulo KSU

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google sacó el paquete legado "tools" del repositorio del SDK; esta acción lo pide
          # por defecto y ahora falla antes de llegar a compilar nada. El paso de abajo ya
          # instala explícitamente todo lo que hace falta, así que acá no instalamos nada.
          packages: ''

      - name: Instalar componentes del SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.9.1 (ver app/build.gradle.kts) exige Gradle 8.11.1 como mínimo; con 8.7
          # el build falla antes de compilar nada ("Minimum supported Gradle version is
          # 8.11.1. Current version is 8.7").
          gradle-version: '8.11.1'

      - name: Compilar APK (release, R8, firmado con la keystore estable)
        run: gradle :app:assembleRelease --stacktrace

      - name: Copiar APK dentro del módulo
        run: |
          mkdir -p module/app
          cp app/build/outputs/apk/release/app-release.apk module/app/sdcard-bind-manager.apk

      - name: Empaquetar módulo final (zip listo para instalar)
        run: |
          cd module
          # mounts.conf es config del usuario, no del proyecto: si algún día aparece
          # trackeado en el repo (a mano o por error), que igual quede afuera del zip.
          # customize.sh ya la recrea/preserva sola en el dispositivo.
          zip -r -X ../sdcard_bind_ui_con_app.zip . -x ".*" -x "mounts.conf"

      - name: Subir zip como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: sdcard_bind_ui_con_app
          path: sdcard_bind_ui_con_app.zip

      - name: Versión y update.json
        id: ver
        run: |
          BASE=$(grep '^version=' module/module.prop | cut -d= -f2 | tr -d '\r')
          CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2 | tr -d '\r')
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            VER="$BASE"; PRE=false; LATEST=true
          else
            # Ramas que no son main (p. ej. preview): pre-release con tag único por ejecución,
            # que no se marca como "latest" (así no pisa update.json de los usuarios).
            VER="${BASE}-${GITHUB_REF_NAME}.${GITHUB_RUN_NUMBER}"; PRE=true; LATEST=false
          fi
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          cat > update.json << EOF
          {
            "version": "$VER",
            "versionCode": $CODE,
            "zipUrl": "https://github.com/jpmorales9038-ai/sdbind_project/releases/download/${VER}/sdcard_bind_ui_con_app.zip",
            "changelog": "https://github.com/jpmorales9038-ai/sdbind_project/releases/tag/${VER}"
          }
          EOF

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SD Bind ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            sdcard_bind_ui_con_app.zip
            update.json
          generate_release_notes: true
          make_latest: ${{ steps.ver.outputs.latest }}
